# Role Validator Application Configuration

# REST API Configuration
rest.api.url=https://jsonplaceholder.typicode.com/posts
rest.api.timeout=30000
rest.api.retry.attempts=3

# Application Settings
app.name=Role Validator
app.version=1.0.0
app.description=Java web application for role validation using REST API

# Logging Configuration
logging.level.com.example=INFO
logging.level.org.apache.http=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Security Settings
security.csrf.enabled=false
security.session.timeout=1800

# Development Settings
dev.mode=false
debug.enabled=false